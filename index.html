<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mollie Pet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F4EC;
    --card:#FFFFFF;
    --line:#E4DDCB;
    --line-soft:#EDE8DA;
    --ink:#33302A;
    --ink-soft:#8A8474;
    --sage:#78855F;
    --sage-soft:#E7EAE0;
    --clay:#B5654A;
    --clay-soft:#F4E3DC;
    --gold:#AD8A2C;
    --gold-soft:#F1E7CD;
    --radius:3px;
    --shadow: 0 1px 2px rgba(51,48,42,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:500;
  }
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:15px;}

  .topbar{
    border-bottom:1px solid var(--line);
    background:var(--paper);
    position:sticky;top:0;z-index:10;
  }
  .topbar-inner{
    max-width:920px;margin:0 auto;padding:22px 24px 18px;
    display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;
  }
  .brand-mark{display:flex;align-items:center;gap:12px;}
  .brand-mark .stamp{
    width:34px;height:34px;border-radius:50%;
    border:1px solid var(--sage);
    display:flex;align-items:center;justify-content:center;
    color:var(--sage);font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;
    flex-shrink:0;
  }
  .brand-mark h1{font-size:21px;}
  .brand-mark .eyebrow{margin-top:2px;}
  nav.tabs{display:flex;gap:4px;}
  nav.tabs button{
    background:none;border:1px solid transparent;
    padding:8px 16px;font-size:13px;letter-spacing:.03em;color:var(--ink-soft);
    border-radius:999px;transition:all .15s ease;
  }
  nav.tabs button.active{
    background:var(--sage-soft);color:var(--sage);border-color:var(--sage-soft);font-weight:500;
  }
  nav.tabs button:hover:not(.active){color:var(--ink);}

  main{max-width:920px;margin:0 auto;padding:32px 24px 80px;}

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  .config-banner{
    background:var(--gold-soft);border:1px solid var(--gold);color:#6b5620;
    padding:14px 18px;border-radius:var(--radius);font-size:13.5px;margin-bottom:24px;
  }
  .config-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:2px;}

  .section{padding:28px 28px;}
  .section + .section{border-top:1px solid var(--line-soft);}
  .section-title{display:flex;align-items:baseline;gap:10px;margin-bottom:18px;}
  .section-title .num{font-family:'Shippori Mincho',serif;color:var(--sage);font-size:13px;}
  .section-title h2{font-size:16px;}

  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:7px;letter-spacing:.03em;}
  .field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
    background:#fff;color:var(--ink);outline:none;transition:border-color .15s;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--sage);}
  .field textarea{resize:vertical;min-height:56px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:640px){.row,.row3{grid-template-columns:1fr;}}

  .pill-group{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:7px 14px;border-radius:999px;font-size:13px;display:flex;align-items:center;gap:7px;
    transition:all .12s ease;
  }
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-soft);flex-shrink:0;}
  .pill:hover{border-color:var(--ink-soft);}
  .pill.selected{border-color:currentColor;font-weight:500;}
  .pill.selected.ok{color:var(--sage);background:var(--sage-soft);}
  .pill.selected.ok .dot{background:var(--sage);}
  .pill.selected.warn{color:var(--clay);background:var(--clay-soft);}
  .pill.selected.warn .dot{background:var(--clay);}
  .pill.selected.neutral{color:var(--ink);background:var(--line-soft);}
  .pill.selected.neutral .dot{background:var(--ink);}

  .assess-note{margin-top:10px;}
  .assess-note input{font-size:13px;padding:8px 11px;}

  .shampoo-option{
    border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;
    cursor:pointer;transition:all .12s ease;
  }
  .shampoo-option:hover{border-color:var(--sage);}
  .shampoo-option.selected{border-color:var(--sage);background:var(--sage-soft);}
  .shampoo-option .name{font-size:13.5px;font-weight:500;}
  .shampoo-option .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:999px;border:1px solid var(--ink);
    background:var(--ink);color:var(--paper);font-size:13.5px;letter-spacing:.03em;font-weight:500;
    transition:opacity .15s;
  }
  .btn:hover{opacity:.85;}
  .btn.secondary{background:transparent;color:var(--ink);border-color:var(--line);}
  .btn.danger{background:transparent;color:var(--clay);border-color:var(--clay-soft);}
  .btn.danger:hover{background:var(--clay-soft);}
  .form-actions{display:flex;justify-content:space-between;align-items:center;padding:22px 28px;border-top:1px solid var(--line);gap:12px;flex-wrap:wrap;}

  .list-toolbar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .search-box{position:relative;flex:1;min-width:220px;}
  .search-box input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;outline:none;}
  .search-box input:focus{border-color:var(--sage);}

  .record-tag{
    display:flex;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--line);
    border-radius:var(--radius);background:#fff;margin-bottom:10px;cursor:pointer;transition:border-color .12s;
  }
  .record-tag:hover{border-color:var(--sage);}
  .record-tag .punch{width:10px;height:10px;border-radius:50%;background:var(--paper);border:1px solid var(--line);flex-shrink:0;}
  .record-tag .info{flex:1;min-width:0;}
  .record-tag .dog{font-weight:500;font-size:14.5px;}
  .record-tag .meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .record-tag .date{font-size:12px;color:var(--ink-soft);text-align:right;white-space:nowrap;}
  .record-tag .flags{display:flex;gap:5px;flex-shrink:0;}
  .record-tag .flags .dot{width:7px;height:7px;border-radius:50%;}

  .empty-state{text-align:center;padding:64px 24px;color:var(--ink-soft);}
  .empty-state .stamp{
    width:48px;height:48px;border-radius:50%;border:1px solid var(--line);margin:0 auto 16px;
    display:flex;align-items:center;justify-content:center;color:var(--line);font-size:20px;
  }

  .detail-header{display:flex;justify-content:space-between;align-items:flex-start;padding:26px 28px;border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap;}
  .detail-header h2{font-size:22px;}
  .detail-header .sub{color:var(--ink-soft);font-size:13px;margin-top:4px;}
  .detail-actions{display:flex;gap:8px;}
  .detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px 24px;padding:22px 28px;}
  @media(max-width:640px){.detail-grid{grid-template-columns:1fr;}}
  .detail-item{padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .detail-item label{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px;}
  .detail-item .val{font-size:14px;}
  .detail-item .val.empty{color:var(--ink-soft);font-style:italic;}
  .tag-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;}
  .tag-chip .dot{width:6px;height:6px;border-radius:50%;}

  .loading{text-align:center;padding:60px;color:var(--ink-soft);font-size:13px;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);padding:12px 22px;border-radius:999px;
    font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:100;opacity:0;transition:opacity .2s,transform .2s;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

  .brand-mark img.logo{width:68px;height:68px;border-radius:50%;object-fit:cover;flex-shrink:0;}

  .revenue-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:0;margin-bottom:24px;overflow:hidden;border-radius:var(--radius);border:1px solid var(--line);}
  .revenue-summary.cols-4{grid-template-columns:repeat(4,1fr);}
  @media(max-width:640px){.revenue-summary{grid-template-columns:1fr;}.revenue-summary.cols-4{grid-template-columns:repeat(2,1fr);}}
  .revenue-summary .stat{background:#fff;padding:22px 24px;}
  .revenue-summary .stat + .stat{border-left:1px solid var(--line);}
  @media(max-width:640px){.revenue-summary .stat + .stat{border-left:none;border-top:1px solid var(--line);}}
  .revenue-summary .stat .eyebrow{margin-bottom:8px;}
  .revenue-summary .stat .num{font-family:'Shippori Mincho',serif;font-size:26px;}
  .month-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:10px;}
  .month-row .m-label{font-weight:500;font-size:14.5px;}
  .month-row .m-meta{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .month-row .m-total{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--sage);}

  .revenue-summary .stat .num.clay {
    color: var(--clay);
  }
  
  .trend-chart-container {
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    overflow-x:auto;
    margin-bottom:24px;
  }
  
  .trend-chart {
    display:flex;
    align-items:flex-end;
    gap:8px;
    min-height:200px;
    padding-bottom:30px;
    position:relative;
  }
  
  .trend-chart .bar-wrapper {
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    min-width:40px;
  }
  
  .trend-chart .bar-stack {
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
  }
  
  .trend-chart .bar-discount {
    width:24px;
    background:var(--clay-soft);
    border-radius:2px 2px 0 0;
    opacity:0.7;
    transition:height 0.3s ease;
  }
  
  .trend-chart .bar-revenue {
    width:24px;
    background:var(--sage);
    border-radius:2px 2px 0 0;
    position:relative;
    transition:height 0.3s ease;
  }
  
  .trend-chart .bar-revenue.small {
    width:32px;
    background:var(--sage-soft);
  }
  
  .trend-chart .bar-value {
    position:absolute;
    top:-20px;
    left:50%;
    transform:translateX(-50%);
    font-size:10px;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  
  .trend-chart .bar-label {
    font-size:10px;
    color:var(--ink-soft);
    text-align:center;
    margin-top:4px;
  }
  
  .trend-chart .bar-count {
    font-size:9px;
    color:var(--ink-soft);
  }
  
  .trend-chart .bar-discount-label {
    font-size:8px;
    color:var(--clay);
  }
  
  .trend-legend {
    display:flex;
    gap:16px;
    justify-content:center;
    font-size:11px;
    color:var(--ink-soft);
    border-top:1px solid var(--line-soft);
    padding-top:12px;
    margin-top:8px;
  }
  
  .trend-legend .legend-item {
    display:flex;
    align-items:center;
    gap:4px;
  }
  
  .trend-legend .legend-color {
    display:inline-block;
    width:12px;
    height:12px;
    border-radius:2px;
    vertical-align:middle;
  }
  
  .trend-legend .legend-color.sage {
    background:var(--sage);
  }
  
  .trend-legend .legend-color.clay {
    background:var(--clay-soft);
  }
  
  .daily-grid {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:24px;
  }
  
  @media(max-width:640px) {
    .daily-grid {
      grid-template-columns:1fr;
    }
  }
  
  .daily-card {
    background:#fff;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;
  }
  
  .daily-card .date-label {
    font-weight:500;
    font-size:13px;
    margin-bottom:4px;
  }
  
  .daily-card .revenue-row {
    display:flex;
    justify-content:space-between;
    font-size:13px;
  }
  
  .daily-card .discount-row {
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--clay);
    margin-top:2px;
  }
  
  .daily-card .no-discount {
    font-size:11px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  
  .daily-card .dog-list {
    margin-top:6px;
    font-size:11px;
    color:var(--ink-soft);
  }
  
  .section-header {
    font-family:'Shippori Mincho',serif;
    font-size:16px;
    margin-bottom:12px;
  }

  /* Photo upload styles */
  .photo-upload-area {
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:20px;
    text-align:center;
    cursor:pointer;
    transition:all .15s;
    background:#fafaf8;
  }
  .photo-upload-area:hover {
    border-color:var(--sage);
    background:var(--sage-soft);
  }
  .photo-upload-area.dragover {
    border-color:var(--sage);
    background:var(--sage-soft);
  }
  .photo-upload-area.uploading {
    opacity:0.6;
    pointer-events:none;
  }
  .photo-upload-area .upload-progress {
    display:none;
    margin-top:8px;
    font-size:13px;
    color:var(--sage);
  }
  .photo-upload-area.uploading .upload-progress {
    display:block;
  }

.photo-thumbnail {
  position:relative;
  width:120px;
  height:120px;
  border:1px solid var(--line);
  border-radius:var(--radius);
  overflow:hidden;
  background: #f0f0f0;
  display: flex;
  align-items: center;
  justify-content: center;
}

.photo-thumbnail img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  cursor: pointer;
}
  .photo-thumbnail .remove-btn {
    position:absolute;
    top:4px;
    right:4px;
    background:var(--clay);
    color:#fff;
    border:none;
    border-radius:50%;
    width:24px;
    height:24px;
    font-size:14px;
    cursor:pointer;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .photo-thumbnail .photo-number {
    position:absolute;
    bottom:4px;
    right:4px;
    background:rgba(0,0,0,0.6);
    color:#fff;
    font-size:10px;
    padding:2px 6px;
    border-radius:10px;
  }

  #printArea{display:none;}
  @media print{
    body > *:not(#printArea){display:none !important;}
    #printArea{display:block !important;}
    .toast{display:none !important;}
  }
  .print-doc{max-width:680px;margin:0 auto;font-family:'Zen Kaku Gothic New',sans-serif;color:#222;padding:20px;}
  .print-doc .p-head{display:flex;align-items:center;gap:14px;border-bottom:2px solid #222;padding-bottom:16px;margin-bottom:20px;}
  .print-doc .p-head img{width:88px;height:88px;border-radius:50%;object-fit:cover;}
  .print-doc .p-head .biz{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:700;}
  .print-doc .p-head .doc-title{margin-left:auto;text-align:right;font-size:12px;color:#666;}
  .print-doc h3{font-family:'Shippori Mincho',serif;font-size:14px;border-bottom:1px solid #ddd;padding-bottom:6px;margin:20px 0 10px;}
  .print-doc .p-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;font-size:13px;margin-bottom:6px;}
  .print-doc .p-grid div span.k{color:#777;display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;}
  .print-doc .p-charge{display:flex;justify-content:space-between;border-top:2px solid #222;margin-top:16px;padding-top:12px;font-size:16px;font-weight:700;}
  .print-doc .p-footer{margin-top:28px;font-size:11.5px;color:#888;text-align:center;}

.access-gate{position:fixed;inset:0;z-index:9999;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:20px;}
.access-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:32px 28px;width:100%;max-width:320px;text-align:center;box-shadow:0 2px 12px rgba(0,0,0,.06);}
body.gate-active .topbar, body.gate-active main#app{display:none;}
</style>
</head>
<body>

<div id="accessGate" class="access-gate" style="display:none;">
  <div class="access-card">
    <div class="stamp" style="font-family:'Shippori Mincho',serif;font-size:32px;margin-bottom:6px;">犬</div>
    <div style="font-family:'Shippori Mincho',serif;font-size:18px;margin-bottom:4px;">Mollie Pet</div>
    <div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:18px;">Enter your access code to continue</div>
    <input type="text" id="accessCodeInput" placeholder="Access code" autocomplete="off"
      style="width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);font-size:14px;text-align:center;letter-spacing:.05em;margin-bottom:12px;">
    <button class="btn" id="accessSubmitBtn" style="width:100%;">Enter</button>
    <div id="accessError" style="color:var(--clay);font-size:12.5px;margin-top:10px;min-height:16px;"></div>
  </div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand-mark" id="brandMark">
      <div class="stamp">犬</div>
      <div>
        <h1>Mollie Pet</h1>
        <div class="eyebrow">Customer &amp; care records</div>
      </div>
    </div>
    <nav class="tabs">
      <button data-tab="list" class="active">All Records</button>
      <button data-tab="form">New Record</button>
      <button data-tab="revenue">Revenue</button>
    </nav>
  </div>
</div>

<main id="app"></main>


<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ======================= CONFIGURATION ======================= */
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzk-BoIlqYQ3yhhuaW6TnZG71aggGT6cs6qBX7Cketzx9jqvlvS1vMw9L59OTgOSWPSig/exec";

const BUSINESS_NAME = "Mollie Pet";
const LOGO_URL = "logo.png";
/* ================================================================ */

const PRE_ASSESSMENT = [
  { key:'Eyes', label:'Eyes', options:[['Normal','ok'],['Redness','warn'],['Discharge','warn'],['Other','neutral']] },
  { key:'Ears', label:'Ears', options:[['Clean','ok'],['Dirty','warn'],['Odor','warn'],['Infection','warn'],['Other','neutral']] },
  { key:'Oral', label:'Oral', options:[['Normal','ok'],['Bad Breath','warn'],['Inflamed','warn'],['Bleeding','warn'],['Plaque/Tartar','warn'],['Other','neutral']] },
  { key:'Anal', label:'Anal', options:[['Normal','ok'],['Redness/Irritation','warn'],['Discharge','warn'],['Other','neutral']] },
  { key:'Nail', label:'Nail', options:[['Normal','ok'],['Overgrown','warn'],['Ingrown','warn'],['Broken','warn'],['Infected','warn'],['Other','neutral']] },
  { key:'Skin', label:'Skin', options:[['None','ok'],['Redness/Irritation','warn'],['Infection','warn'],['Dandruff','warn'],['Oily','warn'],['Flea/Ticks','warn'],['Other','neutral']] },
  { key:'Coat', label:'Coat', options:[['Normal','ok'],['Thin','warn'],['Matting','warn'],['Excessive Shedding','warn'],['Other','neutral']] },
];

/* ======================= ACCESS CODE GATE =======================
   Blocks the app until a valid code is entered. Codes are checked
   against a sheet tab (see checkAccessCode action on the Apps Script
   side) so you can add/remove valid codes without touching this file.
   No "remember me" — the code is required on every visit, including
   a plain refresh, since access isn't stored anywhere in the browser. */

function showAccessGate(){
  document.body.classList.add('gate-active');
  const gate = document.getElementById('accessGate');
  gate.style.display = 'flex';

  const input = document.getElementById('accessCodeInput');
  const btn = document.getElementById('accessSubmitBtn');
  const errorEl = document.getElementById('accessError');

  function attempt(){
    const code = (input.value || '').trim();
    if(!code){ errorEl.textContent = 'Please enter a code.'; return; }
    btn.disabled = true;
    btn.textContent = 'Checking…';
    errorEl.textContent = '';

    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'checkAccessCode', code: code })
    })
    .then(function(res){ return res.json(); })
    .then(function(result){
      if(result && result.success && result.valid){
        document.body.classList.remove('gate-active');
        gate.style.display = 'none';
        bootApp();
      } else {
        errorEl.textContent = 'Incorrect code. Please try again.';
      }
    })
    .catch(function(err){
      console.error('Access code check failed:', err);
      errorEl.textContent = 'Could not verify code — check your connection.';
    })
    .finally(function(){
      btn.disabled = false;
      btn.textContent = 'Enter';
    });
  }

  btn.onclick = attempt;
  input.onkeydown = function(e){ if(e.key === 'Enter') attempt(); };
  input.focus();
}

function bootApp(){
  initBranding();
  render();
  if(configured()) refreshRecords();
}

function fileToCompressedDataUrl(file, maxDim, quality){
  maxDim = maxDim || 1600;
  quality = quality || 0.82;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function uploadPhotos(recordId, files) {
  const uploadedUrls = [];
  for (let i = 0; i < files.length; i++) {
    try {
      const dataUrl = await fileToCompressedDataUrl(files[i]);
      const base64Data = dataUrl.substring(dataUrl.indexOf(',') + 1);
      
      const fileExt = files[i].name.split('.').pop().toLowerCase() || 'jpg';
      
      const response = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'uploadPhoto',
          recordId: recordId,
          mimeType: 'image/jpeg',
          fileName: (files[i].name || 'photo').replace(/\.[^.]+$/, '') + '.' + fileExt,
          data: base64Data
        })
      });
      
      const result = await response.json();
      console.log('Upload result:', result);
      
      if (!result.success) {
        return { success: false, error: result.error || 'Upload failed' };
      }
      if (result.url) {
        uploadedUrls.push(result.url);
        console.log('Uploaded URL:', result.url);
      }
    } catch (err) {
      console.error('Upload error:', err);
      return { success: false, error: err.message || 'Upload failed' };
    }
  }
  return { success: true, urls: uploadedUrls };
}

function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Groups records by owner using a trimmed, case-insensitive key, so
// "Lex", "lex", and "Lex " (stray whitespace/casing from typing on
// different days) are all treated as the same customer instead of
// silently splitting into separate rows/trails.
function ownerKey(name){
  return String(name || 'Unknown').trim().toLowerCase();
}
function ownerDisplayName(name){
  var trimmed = String(name || 'Unknown').trim();
  return trimmed || 'Unknown';
}
function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTimeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.tab === state.tab || (state.tab==='detail' && b.dataset.tab==='list') || (state.tab==='edit' && b.dataset.tab==='form'));
  });
  const app = document.getElementById('app');
  if(!configured()){
    app.innerHTML = configBanner() + emptyConfigState();
    return;
  }
  if(state.tab === 'list') app.innerHTML = renderList();
  else if(state.tab === 'detail') app.innerHTML = renderDetail();
  else if(state.tab === 'form' || state.tab === 'edit') app.innerHTML = renderForm();
  else if(state.tab === 'revenue') app.innerHTML = renderRevenue();
  attachHandlers();
}

function renderRevenue(){
  // --- FILTERS ---
  // Get unique owners and months for filter dropdowns (deduped by normalized key)
  var ownerNameByKey = {};
  state.records.forEach(function(r) {
    var key = ownerKey(r['Owner Name']);
    if (!ownerNameByKey[key]) ownerNameByKey[key] = ownerDisplayName(r['Owner Name']);
  });
  var allOwners = Object.keys(ownerNameByKey).sort(function(a, b){ return ownerNameByKey[a].localeCompare(ownerNameByKey[b]); });
  var allMonths = [...new Set(state.records.map(function(r) { 
    var dateStr = r['Date of Grooming'] || '';
    return dateStr ? dateStr.slice(0, 7) : null; 
  }).filter(Boolean))].sort().reverse();
  
  // Initialize filter state if not exists
  if (!state.revenueFilter) {
    state.revenueFilter = { owner: 'All', month: 'All' };
  }

  // --- FILTER RECORDS ---
  var filteredRecords = state.records.filter(function(r) {
    var ownerMatch = state.revenueFilter.owner === 'All' || ownerKey(r['Owner Name']) === state.revenueFilter.owner;
    var dateStr = r['Date of Grooming'] || '';
    var monthKey = dateStr ? dateStr.slice(0, 7) : null;
    var monthMatch = state.revenueFilter.month === 'All' || monthKey === state.revenueFilter.month;
    return ownerMatch && monthMatch;
  });

  // --- BUILD MONTHLY DATA ---
  const byMonth = {};
  let grossTotal = 0, discountTotal = 0, netTotal = 0, packageTotal = 0, cashTotal = 0, toppedUpTotal = 0, grandCount = 0;

  filteredRecords.forEach(r => {
    const basePrice = parseFloat(r['Base Price (SGD)']) || 0;
    const charge = parseFloat(r['Charges (SGD)']) || 0;
    const gross = basePrice > 0 ? basePrice : charge;
    const discountAmt = Math.max(0, gross - charge);
    const isPackage = r['Has Package'] === 'Yes';
    const topUpAmt = parseFloat(r['Package Top Up (SGD)']) || 0;
    const dateStr = r['Date of Grooming'] || '';
    const monthKey = dateStr ? dateStr.slice(0, 7) : 'unspecified';

    if(!byMonth[monthKey]) byMonth[monthKey] = { count: 0, gross: 0, discount: 0, net: 0, package: 0, cash: 0, toppedUp: 0 };
    byMonth[monthKey].count += 1;
    byMonth[monthKey].gross += gross;
    byMonth[monthKey].discount += discountAmt;
    byMonth[monthKey].net += charge;
    if(isPackage){ byMonth[monthKey].package += charge; } else { byMonth[monthKey].cash += charge; }
    byMonth[monthKey].toppedUp += topUpAmt;

    grossTotal += gross;
    discountTotal += discountAmt;
    netTotal += charge;
    grandCount += 1;
    if(isPackage) packageTotal += charge; else cashTotal += charge;
    toppedUpTotal += topUpAmt;
  });

  const months = Object.keys(byMonth).filter(k => k !== 'unspecified').sort().reverse();

  // --- BUILD OWNER DATA ---
  const ownerMap = {};
  filteredRecords.forEach(function(r) {
    var owner = ownerKey(r['Owner Name']);
    if (!ownerMap[owner]) {
      ownerMap[owner] = {
        displayName: ownerDisplayName(r['Owner Name']),
        gross: 0,
        discount: 0,
        net: 0,
        packageUsed: 0,
        packageToppedUp: 0,
        cashPaid: 0,
        count: 0,
        packageBalance: 0,
        packageType: '',
        packageTrail: []
      };
    }
    var base = parseFloat(r['Base Price (SGD)']) || 0;
    var charge = parseFloat(r['Charges (SGD)']) || 0;
    var gross = base > 0 ? base : charge;
    var discountAmt = Math.max(0, gross - charge);
    var isPackage = r['Has Package'] === 'Yes';
    var topUpAmt = parseFloat(r['Package Top Up (SGD)']) || 0;
    
    ownerMap[owner].gross += gross;
    ownerMap[owner].discount += discountAmt;
    ownerMap[owner].net += charge;
    ownerMap[owner].count += 1;
    if (isPackage) {
      ownerMap[owner].packageUsed += charge;
      if (topUpAmt > 0) {
        ownerMap[owner].packageToppedUp += topUpAmt;
        ownerMap[owner].packageTrail.push({
          date: r['Date of Grooming'] || '',
          time: r['Time of Grooming'] || '',
          dogName: r['Dog Name'] || '',
          type: 'topup',
          amount: topUpAmt,
          // A top-up updates the record's Package Balance immediately, so it
          // carries a real balance (and package name) just like a usage entry.
          // Previously this was left null, which meant a top-up on a new
          // package could never be picked up as the "latest" package below.
          balanceAfter: parseFloat(r['Package Balance']) || 0,
          packageType: r['Package Type'] || ''
        });
      }
      ownerMap[owner].packageTrail.push({
        date: r['Date of Grooming'] || '',
        time: r['Time of Grooming'] || '',
        dogName: r['Dog Name'] || '',
        type: 'usage',
        amount: charge,
        balanceAfter: parseFloat(r['Package Balance']) || 0,
        packageType: r['Package Type'] || ''
      });
    } else {
      ownerMap[owner].cashPaid += charge;
      // No package on this visit — still log it in the trail as a service
      // breakdown line, so cash-paying owners get an expandable trail too.
      ownerMap[owner].packageTrail.push({
        date: r['Date of Grooming'] || '',
        time: r['Time of Grooming'] || '',
        dogName: r['Dog Name'] || '',
        type: 'service',
        service: r['Service Required'] || '',
        amount: charge,
        balanceAfter: null,
        packageType: ''
      });
    }
  });

  // Sort each owner's trail chronologically, and take the CURRENT balance
  // from the most recent entry — not just whichever record happened to be
  // processed last, which previously gave a wrong (oldest-record) balance.
  for (var ownerMapKey in ownerMap) {
    var trail = ownerMap[ownerMapKey].packageTrail;
    trail.sort(function(a, b){ return (String(a.date) + String(a.time)).localeCompare(String(b.date) + String(b.time)); });
    var lastWithBalance = null;
    for (var ti = trail.length - 1; ti >= 0; ti--) {
      if (trail[ti].balanceAfter !== null) { lastWithBalance = trail[ti]; break; }
    }
    if (lastWithBalance) {
      ownerMap[ownerMapKey].packageBalance = lastWithBalance.balanceAfter;
      ownerMap[ownerMapKey].packageType = lastWithBalance.packageType || ownerMap[ownerMapKey].packageType;
    }
  }

  var owners = Object.keys(ownerMap).sort(function(a, b){ return ownerMap[a].displayName.localeCompare(ownerMap[b].displayName); });

  // --- BUILD HTML ---
  let html = '';

  // Filter Controls
  html += `<div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center;background:var(--card);padding:14px 18px;border:1px solid var(--line);border-radius:var(--radius);">

      html += `<div class="card" style="overflow-x:auto;">

      function tableRow(label, m){
        return `<tr style="border-bottom:1px solid var(--line-soft);">

      }

function exportRecordAsPdf(r){
  function row(label, val){
    return '<div><span class="k">' + esc(label) + '</span>' + (val ? esc(val) : '—') + '</div>';
  }
  function tagVal(key, options){
    var val = r[key];
    return val || '—';
  }
  var printArea = document.getElementById('printArea');
  
  var basePrice = parseFloat(r['Base Price (SGD)']) || 0;
  var discount = parseFloat(r['Discount (%)']) || 0;
  var finalCharge = parseFloat(r['Charges (SGD)']) || 0;
  
  if (!r['Charges (SGD)'] && basePrice > 0) {
    finalCharge = basePrice * (1 - discount / 100);
  }
  
  var photos = [];
  if (r['Photos']) {
    if (typeof r['Photos'] === 'string') {
      photos = r['Photos'].split(',').map(function(url) { return url.trim(); }).filter(Boolean);
    } else if (Array.isArray(r['Photos'])) {
      photos = r['Photos'].filter(Boolean);
    }
  }

  var photoHtml = '';
  if (photos.length > 0) {
    photoHtml = '<h3>Photos</h3><div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));gap:10px;margin-top:10px;">';
    photos.forEach(function(url, index) {
      var cleanUrl = url.trim();
      if (cleanUrl && !cleanUrl.startsWith('http')) {
        cleanUrl = 'https://' + cleanUrl;
      }
      var displayUrl = getDirectImageUrl(cleanUrl);
      // In the PDF photo section
photoHtml += '<div style="border:1px solid #ddd;border-radius:4px;overflow:hidden;page-break-inside:avoid;background:#f9f9f9;min-height:150px;display:flex;align-items:center;justify-content:center;">';
photoHtml += '<img src="' + esc(displayUrl) + '" style="width:100%;height:150px;object-fit:contain;display:block;" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'<div style=\\\'padding:20px;text-align:center;color:#999;font-size:14px;\\\'>📷 Photo ' + (index + 1) + '</div>\'">';
photoHtml += '</div>';
    });
    photoHtml += '</div>';
  } else {
    photoHtml = '<p style="color:#999;font-size:12px;">No photos attached</p>';
  }
  
  printArea.innerHTML = '<div class="print-doc">' +
    '<div class="p-head">' +
      (LOGO_URL ? '<img src="' + esc(LOGO_URL) + '" alt="logo">' : '') +
      '<div class="biz">' + esc(BUSINESS_NAME) + '</div>' +
      '<div class="doc-title">Grooming Record<br>' + esc(r['Date of Grooming']||'') + (r['Time of Grooming'] ? ' ' + esc(r['Time of Grooming']) : '') + '</div>' +
    '</div>' +
    '<h3>Dog &amp; Owner</h3>' +
    '<div class="p-grid">' +
      row('Dog Name', r['Dog Name']) +
      row('Owner Name', r['Owner Name']) +
      row('Breed', r['Breed']) +
      row('Gender', r['Gender']) +
      row('Weight (kg)', r['Weight (kg)']) +
    '</div>' +
    '<h3>Service Notes</h3>' +
    '<div class="p-grid">' +
      row('Service Required', r['Service Required']) +
      row('Temperament', formatMultiValue(r['Temperament'])) +
      row('Shampoo Used', formatMultiValue(r['Shampoo Used'])) +
    '</div>' +
    '<h3>Pre-Assessment</h3>' +
    '<div class="p-grid">' +
      PRE_ASSESSMENT.map(function(cat){ return row(cat.label, tagVal(cat.key) + (r[cat.key+' Notes'] ? ' — '+r[cat.key+' Notes'] : '')); }).join('') +
      row('Mats', r['Mats']) +
    '</div>' +
    (r['Style Notes'] ? '<div style="font-size:13px;margin-top:8px;"><span class="k" style="color:#777;font-size:10.5px;text-transform:uppercase;">Style Notes</span>' + esc(r['Style Notes']) + '</div>' : '') +
    (r['Additional Notes'] ? '<div style="font-size:13px;margin-top:8px;"><span class="k" style="color:#777;font-size:10.5px;text-transform:uppercase;">Additional Notes</span>' + esc(r['Additional Notes']) + '</div>' : '') +
    '<h3>Pricing &amp; Package</h3>' +
    '<div class="p-grid" style="margin-bottom:12px;">' +
      row('Base Price (SGD)', r['Base Price (SGD)'] ? parseFloat(r['Base Price (SGD)']).toFixed(2) : '—') +
      row('Discount', r['Discount (%)'] ? r['Discount (%)'] + '%' : '—') +
      row('Discount Notes', r['Discount Notes'] || '—') +
      row('Has Package', r['Has Package'] || 'No') +
      row('Package Type', r['Package Type'] || '—') +
      row('Package Balance (SGD)', r['Package Balance'] ? parseFloat(r['Package Balance']).toFixed(2) : '0.00') +
    '</div>' +
    '<div class="p-charge"><span>Total Charges (SGD)</span><span>' + finalCharge.toFixed(2) + '</span></div>' +
    photoHtml +
    '<div class="p-footer">' + esc(BUSINESS_NAME) + ' @ groomed.by.jen</div>' +
  '</div>';
  
  var imgs = Array.prototype.slice.call(printArea.querySelectorAll('img'));
  if (imgs.length === 0) {
    window.print();
  } else {
    var loaded = 0;
    var done = function(){ loaded++; if (loaded >= imgs.length) window.print(); };
    imgs.forEach(function(img){
      if (img.complete) done();
      else { img.onload = done; img.onerror = done; }
    });
  }
}

function findDogHistory(dogName, ownerName, excludeId){
  const dn = String(dogName||'').trim().toLowerCase();
  const on = String(ownerName||'').trim().toLowerCase();
  if(!dn) return [];
  return state.records.filter(r=>{
    if(excludeId && r['Record ID']===excludeId) return false;
    const rdn = String(r['Dog Name']||'').trim().toLowerCase();
    const ron = String(r['Owner Name']||'').trim().toLowerCase();
    if(rdn !== dn) return false;
    if(on && ron !== on) return false;
    return true;
  }).sort((a,b)=> String(b['Date of Grooming']||'').localeCompare(String(a['Date of Grooming']||'')));
}

function getDirectImageUrl(url) {
  if (!url) return url;
  
  // Already a direct URL
  if (url.includes('uc?export=view') || url.includes('thumbnail?id=')) {
    return url;
  }
  
  // Extract file ID from various Google Drive URL formats
  var fileId = null;
  
  // Format: /file/d/FILE_ID/view
  var match = url.match(/\/file\/d\/([-\w]+)/);
  if (match) fileId = match[1];
  
  // Format: /open?id=FILE_ID
  if (!fileId) {
    match = url.match(/[?&]id=([-\w]+)/);
    if (match) fileId = match[1];
  }
  
  // Format: /uc?export=view&id=FILE_ID (already direct)
  if (!fileId) {
    match = url.match(/[-\w]{25,}/);
    if (match) fileId = match[0];
  }
  
  if (fileId) {
    return 'https://drive.google.com/uc?export=view&id=' + fileId;
  }
  
  return url;
}

function calculatePrice(){
  const baseEl = document.getElementById('f_BasePrice');
  const discountEl = document.getElementById('f_Discount');
  const chargesEl = document.getElementById('f_ChargesFinal');
  const summaryEl = document.getElementById('priceCalculation');
  if(!baseEl || !discountEl || !chargesEl) return;

  const base = parseFloat(baseEl.value) || 0;
  let discount = parseFloat(discountEl.value) || 0;
  discount = Math.min(100, Math.max(0, discount));
  if(discountEl.value !== '') discountEl.value = discount;

  const discountAmount = base * discount / 100;
  const finalPrice = Math.max(0, base - discountAmount);
  chargesEl.value = baseEl.value === '' ? '' : finalPrice.toFixed(2);

  if(summaryEl){
    if(baseEl.value === ''){
      summaryEl.textContent = 'Enter the Base Price (SGD) to calculate the final charge.';
    }else if(discount > 0){
      summaryEl.innerHTML = `${base.toFixed(2)} − ${discount.toFixed(2)}% discount (${discountAmount.toFixed(2)}) = <strong>${finalPrice.toFixed(2)}</strong>`;
    }else{
      summaryEl.innerHTML = `Final charge: <strong>${finalPrice.toFixed(2)}</strong>`;
    }
  }

  const warningEl = document.getElementById('packageBalanceWarning');
  if(warningEl){
    const hasPkgBtn = document.querySelector('.package-toggle.selected[data-package="Yes"]');
    const balanceEl = document.getElementById('f_PackageBalance');
    const currentBalance = balanceEl ? (parseFloat(balanceEl.value) || 0) : 0;
    if(hasPkgBtn && baseEl.value !== '' && currentBalance < finalPrice){
      const shortBy = (finalPrice - currentBalance).toFixed(2);
      const ownerEl = document.getElementById('f_OwnerName');
      const ownerName = ownerEl ? (ownerEl.value || 'this owner') : 'this owner';
      warningEl.innerHTML = `<div style="margin-top:10px;padding:10px 12px;background:var(--clay-soft);border:1px solid var(--clay);border-radius:var(--radius);color:var(--clay);font-size:12.5px;">
        <strong>⚠ Insufficient package balance</strong> — short by ${shortBy}.
        Current balance (${currentBalance.toFixed(2)}) won't fully cover this ${finalPrice.toFixed(2)} charge.
        Either ask ${esc(ownerName)} to reload the package, or collect ${shortBy} from the customer separately.
      </div>`;
    } else {
      warningEl.innerHTML = '';
    }
  }
}

function setupPricingHandlers(){
  const baseEl = document.getElementById('f_BasePrice');
  const discountEl = document.getElementById('f_Discount');
  const balanceEl = document.getElementById('f_PackageBalance');
  if(baseEl) baseEl.oninput = calculatePrice;
  if(discountEl) discountEl.oninput = calculatePrice;
  if(balanceEl) balanceEl.oninput = calculatePrice;

  document.querySelectorAll('.discount-preset').forEach(btn=>{
    btn.onclick = ()=>{
      const discountEl = document.getElementById('f_Discount');
      if(discountEl){
        discountEl.value = btn.dataset.discount;
        calculatePrice();
      }
    };
  });
  calculatePrice();
}

function setupPhotoUpload() {
  const uploadArea = document.getElementById('photoUploadArea');
  const fileInput = document.getElementById('photoInput');
  
  if (!uploadArea || !fileInput) return;
  
  uploadArea.onclick = () => {
    if (!state.detailId) {
      showToast('Please save the record first before uploading photos');
      return;
    }
    
    const r = state.records.find(x => x['Record ID'] === state.detailId);
    const currentPhotos = (r && r['Photos']) ? r['Photos'].split(',').filter(Boolean) : [];
    if (currentPhotos.length >= 5) {
      showToast('Maximum 5 photos allowed');
      return;
    }
    
    fileInput.click();
  };
  
  fileInput.onchange = async () => {
    if (fileInput.files.length === 0) return;
    
    if (!state.detailId) {
      showToast('Please save the record first');
      fileInput.value = '';
      return;
    }
    
    const r = state.records.find(x => x['Record ID'] === state.detailId);
    const currentPhotos = (r && r['Photos']) ? r['Photos'].split(',').filter(Boolean) : [];
    const remainingSlots = 5 - currentPhotos.length;
    
    if (fileInput.files.length > remainingSlots) {
      showToast(`You can only upload ${remainingSlots} more photo${remainingSlots > 1 ? 's' : ''}`);
      fileInput.value = '';
      return;
    }
    
    const files = Array.from(fileInput.files);
    
    uploadArea.classList.add('uploading');
    showToast(`Uploading ${files.length} photo${files.length > 1 ? 's' : ''}...`);
    
    try {
      const result = await uploadPhotos(state.detailId, files);
      if (result.success) {
        showToast('Photos uploaded successfully!');
        await refreshRecords();
        render();
      } else {
        showToast('Upload failed: ' + result.error);
      }
    } catch (err) {
      showToast('Upload failed. Please try again.');
      console.error(err);
    }
    
    uploadArea.classList.remove('uploading');
    fileInput.value = '';
  };
  
  uploadArea.ondragover = (e) => {
    e.preventDefault();
    uploadArea.classList.add('dragover');
  };
  
  uploadArea.ondragleave = () => {
    uploadArea.classList.remove('dragover');
  };
  
  uploadArea.ondrop = async (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    
    if (e.dataTransfer.files.length > 0) {
      if (!state.detailId) {
        showToast('Please save the record first before uploading photos');
        return;
      }
      fileInput.files = e.dataTransfer.files;
      fileInput.onchange();
    }
  };
  
  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.onclick = async (e) => {
      e.stopPropagation();
      const url = btn.dataset.url;
      if (!confirm('Remove this photo?')) return;
      
      if (!state.detailId) {
        showToast('Please save the record first');
        return;
      }
      
      const r = state.records.find(x => x['Record ID'] === state.detailId);
      const currentPhotos = (r && r['Photos']) ? r['Photos'].split(',').filter(Boolean) : [];
      const updatedPhotos = currentPhotos.filter(u => u !== url);
      
      await apiUpdate(state.detailId, { 'Photos': updatedPhotos.join(',') });
      showToast('Photo removed');
      await refreshRecords();
      render();
    };
  });
}

function getOwnerPackageBalance(ownerName) {
  if (!ownerName) return Promise.resolve(null);
  console.log('Fetching package balance for owner:', ownerName);
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    body: JSON.stringify({
      action: 'getPackageBalance',
      ownerName: ownerName
    })
  })
  .then(function(res) { 
    console.log('Response status:', res.status);
    return res.json(); 
  })
  .then(function(result) {
    console.log('Package balance result:', result);
    if (result.success && result.hasPackage) {
      return result;
    }
    return null;
  })
  .catch(function(err) {
    console.error('Error fetching package balance:', err);
    return null;
  });
}

// Shared: looks up an owner's package and applies it to state.formData, then re-renders.
// Used whenever the Owner Name becomes known — whether typed directly, or
// filled in automatically from a matched Dog Name — so the package check
// never depends on which field the groomer happens to fill in first.
function refreshOwnerPackage(ownerName){
  if(!ownerName) return;
  getOwnerPackageBalance(ownerName).then(function(pkgInfo){
    if(pkgInfo && pkgInfo.hasPackage){
      state.formData['Has Package'] = 'Yes';
      state.formData['Package Type'] = pkgInfo.packageType || '';
      state.formData['Package Balance'] = pkgInfo.balance.toFixed(2);
      showToast('Package balance loaded: ' + pkgInfo.balance.toFixed(2));
    } else {
      state.formData['Has Package'] = 'No';
      state.formData['Package Balance'] = '';
      state.formData['Package Type'] = '';
    }
    render();
  });
}

const topUpBtn = document.getElementById('topUpBtn');
const creditTopUpInput = document.getElementById('f_CreditTopUp');

if (topUpBtn && creditTopUpInput) {
  topUpBtn.onclick = async function() {
    // Pull the latest typed values (e.g. Package Type) out of the DOM
    // and into state.formData BEFORE we mutate anything and re-render —
    // otherwise render() rebuilds the form from the stale state.formData
    // and wipes out whatever the groomer just typed but hadn't blurred out of.
    collectFormData();

    const ownerName = state.formData['Owner Name'];
    if (!ownerName) {
      showToast('Please enter an owner name first');
      return;
    }
    
    const topUpAmount = parseFloat(creditTopUpInput.value);
    if (!topUpAmount || topUpAmount <= 0) {
      showToast('Please enter a valid top-up amount');
      return;
    }
    
    const currentBalance = parseFloat(state.formData['Package Balance']) || 0;
    const newBalance = currentBalance + topUpAmount;
    const priorTopUp = parseFloat(state.formData['Package Top Up (SGD)']) || 0;
    const newTopUpTotal = priorTopUp + topUpAmount;
    
    // Update the balance in the form
    state.formData['Package Balance'] = newBalance.toFixed(2);
    state.formData['Package Top Up (SGD)'] = newTopUpTotal.toFixed(2);
    state.formData['Has Package'] = 'Yes'; // Auto-enable package
    
    // Save the update to the backend immediately
    try {
      // If there's an existing record, update it
      if (state.editingId) {
        await apiUpdate(state.editingId, { 
          'Package Balance': newBalance.toFixed(2),
          'Package Top Up (SGD)': newTopUpTotal.toFixed(2),
          'Has Package': 'Yes'
        });
        showToast('Credit topped up! New balance: ' + newBalance.toFixed(2));
      } else {
        // For new records, just update the form
        showToast('Credit added! Balance: ' + newBalance.toFixed(2) + ' (Save record to keep)');
      }
      
      // Clear the top-up input
      creditTopUpInput.value = '';
      
      // Refresh records and re-render
      await refreshRecords();
      render();
    } catch (err) {
      showToast('Failed to top up credit: ' + err.message);
      console.error(err);
    }
  };
}
  
  // Shampoo options
  document.querySelectorAll('.shampoo-option').forEach(opt=>{
    opt.onclick = ()=>{
      collectFormData();
      const current = parseMultiValue(state.formData['Shampoo Used']);
      const value = opt.dataset.value;
      const next = current.includes(value) ? current.filter(v=>v!==value) : [...current, value];
      state.formData['Shampoo Used'] = next.join(', ');
      render();
    };
  });

  // Setup pricing handlers
  setupPricingHandlers();
  
  // Setup photo upload
  setupPhotoUpload();

  // Cancel button
  const cancelBtn = document.getElementById('cancelFormBtn');
  if(cancelBtn) cancelBtn.onclick = function(){ 
    state.tab = state.editingId ? 'detail' : 'list'; 
    render(); 
  };

  // Dog name change - fill history, and check package if this reveals a new owner
  const dogInput = document.getElementById('f_DogName');
  if(dogInput) {
    dogInput.onchange = function() {
      collectFormData();
      var history = findDogHistory(state.formData['Dog Name'], state.formData['Owner Name'], state.editingId);
      if(history.length){
        var latest = history[0];
        var ownerWasBlank = !state.formData['Owner Name'];
        if(ownerWasBlank) state.formData['Owner Name'] = latest['Owner Name'];
        if(!state.formData['Breed']) state.formData['Breed'] = latest['Breed'];
        if(!state.formData['Gender']) state.formData['Gender'] = latest['Gender'];
        if(ownerWasBlank && state.formData['Owner Name']){
          refreshOwnerPackage(state.formData['Owner Name']);
        }
      }
      render();
    };
  }

  // Owner name change - fetch package balance AND history
  const ownerInput = document.getElementById('f_OwnerName');
  if(ownerInput) {
    ownerInput.onchange = function() {
      collectFormData();
      var ownerName = state.formData['Owner Name'];

      if (ownerName) {
        refreshOwnerPackage(ownerName);
      }

      var history = findDogHistory(state.formData['Dog Name'], state.formData['Owner Name'], state.editingId);
      if(history.length){
        var latest = history[0];
        if(!state.formData['Breed']) state.formData['Breed'] = latest['Breed'];
        if(!state.formData['Gender']) state.formData['Gender'] = latest['Gender'];
      }
      render();
    };
  }

  // Save button
  const saveBtn = document.getElementById('saveFormBtn');
  if(saveBtn) saveBtn.onclick = async ()=>{
    collectFormData();
    
    if(!state.formData['Dog Name']){ 
      showToast('Please enter a dog name'); 
      return; 
    }
    
    // Calculate final charges
    const basePrice = parseFloat(state.formData['Base Price (SGD)']) || 0;
    const discount = parseFloat(state.formData['Discount (%)']) || 0;
    const finalCharge = basePrice * (1 - discount / 100);
    state.formData['Charges (SGD)'] = finalCharge.toFixed(2);
    
    // Check package balance if package is selected
    if (state.formData['Has Package'] === 'Yes') {
      const currentBalance = parseFloat(state.formData['Package Balance']) || 0;

      if (currentBalance < finalCharge) {
        const shortAmount = (finalCharge - currentBalance).toFixed(2);
        state.formData['Package Balance'] = '0.00';
        showToast('Package balance depleted — ' + shortAmount + ' to collect separately');
      } else {
        const newBalance = currentBalance - finalCharge;
        state.formData['Package Balance'] = newBalance.toFixed(2);
        showToast('Package balance updated: ' + newBalance.toFixed(2));
      }
    }
    
    saveBtn.textContent = 'Saving…'; 
    saveBtn.disabled = true;
    
    try{
      let result;
      if(state.editingId){
        await apiUpdate(state.editingId, state.formData);
        showToast('Record updated');
        state.detailId = state.editingId;
      }else{
        result = await apiCreate(state.formData);
        state.editingId = result.id;
        state.detailId = result.id;
        showToast('Record created!');
      }
      
      await refreshRecords();
      state.tab = 'detail';
      render();
    }catch(err){
      showToast('Could not save — check connection');
      console.error(err);
      saveBtn.textContent = state.editingId ? 'Save Changes' : 'Save Record'; 
      saveBtn.disabled = false;
    }
  };

  // ------------------------------
  // REVENUE FILTER HANDLERS
  // ------------------------------
  const ownerFilter = document.getElementById('ownerFilter');
  const monthFilter = document.getElementById('monthFilter');
  const clearFiltersBtn = document.getElementById('clearFiltersBtn');

  if (ownerFilter) {
    ownerFilter.onchange = function() {
      state.revenueFilter.owner = this.value;
      render();
    };
  }

  if (monthFilter) {
    monthFilter.onchange = function() {
      state.revenueFilter.month = this.value;
      render();
    };
  }

  if (clearFiltersBtn) {
    clearFiltersBtn.onclick = function() {
      state.revenueFilter.owner = 'All';
      state.revenueFilter.month = 'All';
      // Update the select elements to reflect the reset
      const ownerSelect = document.getElementById('ownerFilter');
      const monthSelect = document.getElementById('monthFilter');
      if (ownerSelect) ownerSelect.value = 'All';
      if (monthSelect) monthSelect.value = 'All';
      render();
    };
  }

  // ------------------------------
  // REVENUE VIEW TOGGLE HANDLERS
  // ------------------------------
  const viewMonthlyBtn = document.getElementById('viewMonthlyBtn');
  const viewOwnerBtn = document.getElementById('viewOwnerBtn');

  if (viewMonthlyBtn) {
    viewMonthlyBtn.onclick = function() {
      state.revenueView = 'monthly';
      render();
    };
  }

  if (viewOwnerBtn) {
    viewOwnerBtn.onclick = function() {
      state.revenueView = 'owner';
      render();
    };
  }

  document.querySelectorAll('.owner-trail-toggle').forEach(function(row){
    row.onclick = function(){
      var owner = row.dataset.owner;
      state.expandedOwnerTrail = (state.expandedOwnerTrail === owner) ? null : owner;
      render();
    };
  });
}

function collectFormData(){
  const d = state.formData;
  const map = {
    'Dog Name':'f_DogName',
    'Owner Name':'f_OwnerName',
    'Date of Grooming':'f_Date',
    'Time of Grooming':'f_Time',
    'Breed':'f_Breed',
    'Weight (kg)':'f_Weight',
    'Style Notes':'f_StyleNotes',
    'Additional Notes':'f_AdditionalNotes',
    'Service Notes':'f_ServiceNotes',
    'Charges (SGD)':'f_ChargesFinal',
    'Base Price (SGD)':'f_BasePrice',
    'Discount (%)':'f_Discount',
    'Discount Notes':'f_DiscountNotes',
    'Temperament Notes':'f_TemperamentNotes',
    'Shampoo Notes':'f_ShampooNotes',
    'Package Type':'f_PackageType',
    'Package Balance':'f_PackageBalance'
    // Note: Credit Top Up is handled separately, not saved directly
  };
  PRE_ASSESSMENT.forEach(cat=>{ 
    map[cat.key+' Notes'] = 'f_'+cat.key+'Notes';
  });
  Object.entries(map).forEach(([k,id])=>{
    const el = document.getElementById(id);
    if(el) d[k] = el.value;
  });
}

showAccessGate();
</script>
